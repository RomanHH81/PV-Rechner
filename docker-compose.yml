name: pv-rechner

services:
  pv-rechner:
    container_name: pv-rechner
    build:
      context: .
      dockerfile: Dockerfile
    image: pv-rechner:latest
    restart: unless-stopped
    # Wir hängen uns an das bestehende primaflow-Netz, damit
    # Nginx Proxy Manager den Container per Namen erreichen kann.
    # Falls das Netz noch nicht existiert, legt Portainer es an.
    networks:
      - primaflow-net
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Optional: Resource-Limits, damit der Container dem
    # Nachbarn (Postgres, n8n, ...) nicht den RAM wegnimmt.
    # 512 MB reichen für ein statisches Next.js locker.
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  primaflow-net:
    name: primaflow-net
    driver: bridge
